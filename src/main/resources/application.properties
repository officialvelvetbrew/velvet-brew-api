spring.application.name=velvetbrew

server.servlet.context-path=/

# nginx terminates TLS and forwards X-Forwarded-Proto/Host - without this,
# Spring (and springdoc's generated OpenAPI server URL) ignores those headers
# and assumes plain http, so Swagger UI's spec fetch and "Try it out" calls
# get built as http:// links that browsers block as mixed content on an
# https:// page.
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://13.206.81.86:5432/velvetbrewdb?currentSchema=public
spring.datasource.username=velvetbrew
spring.datasource.password=Velvetbrew@2321
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Caching (Ehcache via JCache/JSR-107)
spring.cache.type=jcache
spring.cache.jcache.config=classpath:ehcache.xml

jwt.secret=Q4n9Zx8Lp2Vm7Rt5Hs1Yw3Kd8Nc6Bj0Fa9Xq4Pe7Lm2Uv8Tr5Gs0Wy1Hk6Jc3Dn
jwt.expiration=86400000

razorpay.key.id=rzp_live_TLgImQUGURTwyp
razorpay.key.secret=wA4EptvUtKiAvdtpqpLVGtto

server.port=8080

# Mail (forgot-password emails) - credentials come from env vars, never commit real ones here
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.password-reset.token-expiry-minutes=30
app.password-reset.frontend-url=${RESET_PASSWORD_URL:http://localhost:3000/reset-password}